<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage & SPY Tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .topbar {
    background: #1d1d1f;
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 32px;
    height: 52px;
    flex-shrink: 0;
  }
  .topbar .brand {
    font-size: 0.9rem;
    font-weight: 700;
    color: white;
    white-space: nowrap;
  }
  .tabs {
    display: flex;
    gap: 4px;
  }
  .tab {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    cursor: pointer;
    border: none;
    background: transparent;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .tab:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); }
  .tab.active { background: rgba(255,255,255,0.15); color: white; }

  .frame-container { flex: 1; position: relative; overflow: hidden; }
  iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
    background: #f5f5f7;
    transition: opacity 0.2s;
  }
  iframe.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">📊 Mortgage &amp; SPY Tools</div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('calculator', this)">🏠 Mortgage Calculator</button>
    <button class="tab" onclick="switchTab('chart', this)">📈 SPY Tradeoff Chart</button>
  </div>
</div>

<div class="frame-container">
  <iframe id="frame-calculator" src="mortgage_calculator.html"></iframe>
  <iframe id="frame-chart"      src="mortgage_vs_spy_chart.html" class="hidden"></iframe>
</div>

<script>
function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('iframe').forEach(f => f.classList.add('hidden'));
  document.getElementById('frame-' + name).classList.remove('hidden');
}
</script>
</body>
</html>
